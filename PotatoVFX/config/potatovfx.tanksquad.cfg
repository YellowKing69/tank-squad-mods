## Settings file was created by plugin Potato VFX v1.4.2
## Plugin GUID: potatovfx.tanksquad

[Debug]

## Write diagnostic lines to the log.
# Setting type: Boolean
# Default value: false
VerboseLog = false

[MGTracers]

## Remove the tail/streak behind machine-gun and rifle tracers (DP-27, MG34 ...). The glowing bullet stays. Game: off.
# Setting type: Boolean
# Default value: true
RemoveTail = true

## Rounds up to this calibre in mm count as machine-gun / rifle ammo (7.62, 7.92 ...). Tank shells are far above it.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 1 to 40
MaxCaliber = 30

## Optional: ammo names containing one of these words also count as MG ammo (comma separated). Normally not needed.
# Setting type: String
# Default value: 
AmmoMatch = 

## Tracer effects whose name contains one of these words are MG / rifle tracers whatever the ammo says (the game's are P_VFX_Tracer_SOV_Rifle and P_VFX_Tracer_GER_Rifle).
# Setting type: String
# Default value: rifle
TracerMatch = rifle, MG, DT

## Which parts of the MG tracer are the tail (switched off). The game's MG tracer has two: P_G_VFX_TracerTrail (the long streak) and P_G_VFX_ParticleTrail (the glowing round). Comma separated; if the wrong one disappears, swap them. Live.
# Setting type: String
# Default value: P_G_VFX_TracerTrail
TailParts = P_G_VFX_TracerTrail

## MG tracer parts that draw the glowing round AND its tail in one effect: these are not switched off, their tail settings are changed instead (TailSettings). Live.
# Setting type: String
# Default value: P_G_VFX_ParticleTrail
TweakParts = P_G_VFX_ParticleTrail

## Effect settings for the TweakParts: 'name=value; name=value' (names as listed in the log line '[MG] settings of ...'). auto = every setting named like a trail/tail length, lifetime, width, count or rate set to 0. Empty = game values. Live.
# Setting type: String
# Default value: Ribbon Life=0; Ribbon Max Size overLife=0
TailSettings = auto

## Effect parts whose name contains one of these words are tail parts. Trail renderers and particle trails are always tail.
# Setting type: String
# Default value: trail,tail,streak,smoke
TailMatch = trail,tail,streak,smoke

## Size of the MG tracer glow. -1 = same as [Shells] GlowScale (the look you have now). Game: 1.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 3
GlowScale = -1

## MG tracer glow brightness. -1 = same as [Shells] GlowIntensity. Game: 1.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -1 to 5
GlowIntensity = -1

[OffsiteSmoke]

## Show the smoke behind rockets and off-site artillery. Off = better performance. Game: on.
# Setting type: Boolean
# Default value: false
RocketSmoke = false

## Show rocket and off-site artillery trails at all (fire, smoke, glow). Off = best performance. Game: on.
# Setting type: Boolean
# Default value: true
Trails = true

## Trail names containing one of these words count as rockets.
# Setting type: String
# Default value: rocket,nebelwerfer,katyusha,calliope
Match = rocket,nebelwerfer,katyusha,calliope

[Shells]

## Remove the smoke trail behind tank shells (rockets: see OffsiteSmoke). Game: off.
# Setting type: Boolean
# Default value: true
RemoveSmoke = true

## Effect parts whose name contains one of these words count as smoke.
# Setting type: String
# Default value: smoke
SmokeMatch = smoke

## Size of the shell glow. Game: 1.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
GlowScale = 0.5

## Shell glow: below 1 = fainter, above 1 = brighter. Game: 1.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
GlowIntensity = 1

## Show the smoke cloud in front of your barrel when firing. Game: on.
# Setting type: Boolean
# Default value: false
FrontSmoke = false

## Show the smoke fanning out left and right of your barrel when firing (the flash stays). Game: on.
# Setting type: Boolean
# Default value: true
SideSmoke = true

